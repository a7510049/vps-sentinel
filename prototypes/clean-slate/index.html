<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>哨站 | 前端設計原型</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header><div><a href="index.html">哨站 <span>OUTPOST</span></a><span>設計預覽</span></div></header>
  <main>
    <h1>選擇哨站的新介面</h1>
    <p class="intro">三套原型使用同一組示範主機。選一套打開操作，或先比較桌面與手機截圖。</p>
    <div class="options">
      <article>
        <a class="thumb" href="inventory.html"><img src="screenshots/inventory-desktop.png" alt="主機清冊桌面版，表格右側有主機詳情" width="1440" height="900"></a>
        <div class="option-content">
          <h2><span>A</span> 主機清冊</h2>
          <p>先找主機。用表格比較資源，點主機查看詳情與操作。</p>
          <a class="open" href="inventory.html">操作原型 <span aria-hidden="true">↗</span></a>
          <div class="captures"><a href="screenshots/inventory-desktop.png">桌面截圖</a><a href="screenshots/inventory-mobile.png">手機截圖</a><a href="screenshots/inventory-mobile-detail.png">手機主機詳情</a></div>
        </div>
      </article>
      <article>
        <a class="thumb" href="monitor.html"><img src="screenshots/monitor-desktop.png" alt="即時監測桌面版，上方是跨主機趨勢，下方是資源矩陣" width="1440" height="900"></a>
        <div class="option-content">
          <h2><span>B</span> 即時監測</h2>
          <p>先看趨勢。用同一張圖比對各台主機，再查個別資源。</p>
          <a class="open" href="monitor.html">操作原型 <span aria-hidden="true">↗</span></a>
          <div class="captures"><a href="screenshots/monitor-desktop.png">桌面截圖</a><a href="screenshots/monitor-mobile.png">手機截圖</a></div>
        </div>
      </article>
      <article>
        <a class="thumb" href="incidents.html"><img src="screenshots/incidents-desktop.png" alt="事件中心桌面版，中央有時間軸，右側有事件詳情" width="1440" height="900"></a>
        <div class="option-content">
          <h2><span>C</span> 事件中心</h2>
          <p>先處理異常。從時間軸選取事件，再鑽入相關主機。</p>
          <a class="open" href="incidents.html">操作原型 <span aria-hidden="true">↗</span></a>
          <div class="captures"><a href="screenshots/incidents-desktop.png">桌面截圖</a><a href="screenshots/incidents-mobile.png">手機截圖</a><a href="screenshots/incidents-mobile-detail.png">手機事件詳情</a></div>
        </div>
      </article>
    </div>
    <p class="footer">原型使用本機示範資料。<a href="README.md">查看功能範圍與驗證紀錄</a></p>
  </main>
</body>
</html>
