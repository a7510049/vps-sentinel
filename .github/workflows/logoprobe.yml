name: logoprobe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: python3 {0}
        run: |
          import urllib.request, hashlib, struct, base64, re, json, urllib.request as U
          def get(u):
              try:
                  r = U.urlopen(U.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20)
                  return r.status, r.read(), r.geturl()
              except Exception as e:
                  return str(e)[:40], b"", ""
          codes = set("3S 3U 5J 5X 5Y 6J 7C 7G 9C 9G AA AC AE AF AI AK AS AV AY AZ B7 BA BC BI BR BX CA CI CK CM CV CX CZ D7 DD DL EK ET EY FD FM FW FX GA GK HB HD HO HU HX IT JL JQ JT JX K4 KE KL KZ LD LH LJ LO LX MF MH MM MU NH NU NX NZ O3 OD OS OZ PG PO PR QF QH QR QV RS RU SC SL SQ TG TK TR TW UA UO UX VJ VN VU VZ Z2 ZE ZH ZE RF Q0 XQ".split())
          try:
              t = U.urlopen("https://www.taoyuan-airport.com/uploads/flightx/a_flight_v4.txt", timeout=30).read().decode("big5hkscs", "replace")
              for line in t.splitlines():
                  x = line.split(",")
                  if len(x) > 4: codes.add(x[2].strip()[:2])
          except Exception as e: print("fids", e)
          for u in ["https://www.kia.gov.tw/data/arr.json", "https://www.kia.gov.tw/data/dep.json"]:
              try:
                  for r in json.loads(U.urlopen(u, timeout=30).read().decode("utf-8-sig")): codes.add(str(r.get("airLineIATA") or "")[:2])
              except Exception as e: print("khh", e)
          codes = sorted(c for c in codes if re.fullmatch(r"[A-Z0-9]{2}", c))
          print("CODES", len(codes), " ".join(codes))
          src = {"G": "https://www.gstatic.com/flights/airline_logos/70px/{c}.png", "A": "https://pics.avs.io/200/200/{c}.png",
                 "K": "https://images.kiwi.com/airlines/128/{c}.png", "D": "https://images.daisycon.io/airline/?width=128&height=128&iata={c}"}
          dump = {"ZE", "RF", "Q0", "BR", "LJ", "7C"}
          for c in codes:
              row = [c]
              for k, u in src.items():
                  st, b, fin = get(u.format(c=c))
                  wh = struct.unpack(">II", b[16:24]) if b[:4] == b"\x89PNG" else (0, 0)
                  row.append(f"{k}:{st}:{len(b)}:{hashlib.sha1(b).hexdigest()[:8]}:{wh[0]}x{wh[1]}")
                  if c in dump and b and len(b) < 40000: print("B64", c, k, base64.b64encode(b).decode())
              print("ROW", " ".join(row))
