# 安卓 App：自動做出安裝檔，放到 GitHub 的「安卓 App」下載頁；再用模擬手機跑一遍截圖、錄影
name: 安卓 App

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current
      - name: 做安裝檔
        env:
          APP_BUILD: ${{ github.run_number }}
        run: gradle -p android --no-daemon assembleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/
      - name: 放到下載頁
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk vps-sentinel.apk
          gh release view android >/dev/null 2>&1 || gh release create android --title "安卓 App" --notes "用手機打開這一頁，點 vps-sentinel.apk 下載安裝。" --latest=false
          gh release upload android vps-sentinel.apk --clobber

  shots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/
      - name: 開啟虛擬化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 模擬手機截圖、錄影
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/tools/shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
