# 機場起降會不會拖慢監控：用真實資料量（開發用，手動執行）
name: fly-perf
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-u3ztfk]
    paths: [tools/fly_perf.py, .github/workflows/fly-perf.yml]
jobs:
  perf:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: nproc && lscpu | head -15
      - run: python3 tools/fly_perf.py
