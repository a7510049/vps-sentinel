# 每次推上新版或開合併請求時，自動檢查：樣式規則、程式語法、安裝腳本、基本功能
name: 自動檢查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 程式語法
        run: python3 -m py_compile sentinel.py pair.py download.py backup.py guard.py notes.py adblock.py photo.py album.py fly.py tools/style_check.py tests/*.py
      - name: 樣式規則
        run: python3 tools/style_check.py
      - name: 安裝腳本（shellcheck）
        run: shellcheck *.sh
      - name: 安全靜態檢查（ruff）
        run: |
          pip install -q ruff
          ruff check --select S102,S103,S105,S106,S107,S201,S202,S301,S302,S303,S304,S305,S306,S307,S308,S313,S314,S315,S316,S317,S318,S319,S321,S323,S324,S501,S502,S503,S504,S505,S506,S507,S508,S509,S601,S602,S604,S605,S606,S608,S609,S610,S611,S612,S701,S702,S704 sentinel.py pair.py download.py backup.py guard.py notes.py adblock.py photo.py album.py fly.py
      - name: 基本功能測試
        run: python3 -m unittest discover -s tests -v
