name: flydebug
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s -m 20 "https://api.github.com/repos/wiedehopf/tar1090-db/contents/db?ref=master" | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d), [x['name'] for x in d][:80]); print([ (x['name'],x['size']) for x in d if x['name'].startswith('89')])"
          for u in https://cdn.jsdelivr.net/gh/wiedehopf/tar1090-db@master/db/8.js https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/8.js https://cdn.jsdelivr.net/gh/wiedehopf/tar1090-db@master/db/89.js https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/89.js; do echo "== $u"; curl -s -m 20 -o f -w "%{http_code} %{size_download} %{content_type}\n" "$u"; head -c 300 f | od -c | head -5; done
          for h in 8990b5 899011 8991a1 89901a; do curl -s -m 10 https://hexdb.io/api/v1/aircraft/$h; echo; done
