# 暫時的：用真的資料跑一次看板（查完就刪）
name: flydebug
on:
  push:
    branches: [claude/project-thread-wqdvmy]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          cat > p.py <<'P'
          import sys, time
          sys.path.insert(0, "tests")
          from test_passkey import load_sentinel
          s = load_sentinel()
          for rnd in range(2):
              for c in ["TPE", "TSA", "RMQ", "KHH"]:
                  try:
                      s.FLY["cache"].clear()
                      b = s.fly_board(c)
                      print(rnd, c, b["srcs"], {k: len(b[k]) for k in ("arr", "dep", "gnd", "over")})
                      for k in ("arr", "dep", "gnd"):
                          for p in b[k][:10]:
                              print("  ", k, p["fn"], p["alt"], p["spd"], p["d"], p["st"], p["org"] and p["org"]["code"], p["dst"] and p["dst"]["code"])
                  except Exception as e:
                      print(c, "ERR", e)
                  time.sleep(1.5)
              time.sleep(25)
          P
          python3 p.py
