name: flydebug
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "== TPE page"; curl -sL -m 20 -A "Mozilla/5.0" https://www.taoyuan-airport.com/ > t.html; wc -c t.html; grep -oiE '[^"'"'"' ]*(logo|icon)[^"'"'"' ]*\.(png|svg|jpg|gif|ico)' t.html | sort -u | head -20
          echo "== RMQ page"; curl -sL -m 40 -A "Mozilla/5.0" "https://www.tca.gov.tw/?act=fids" > r.html; wc -c r.html; grep -oiE '[^"'"'"' ]*(logo|icon)[^"'"'"' ]*\.(png|svg|jpg|gif|ico)' r.html | sort -u | head -20
          for u in https://www.tsa.gov.tw/static/img/pavicon.png https://www.tsa.gov.tw/static/img/logo.png https://www.kia.gov.tw/images/apple-touch-icon.png https://www.kia.gov.tw/images/LOGO.png; do
            curl -s -o i -w "%{http_code} %{content_type} %{size_download} $u :: " -m 20 -A "Mozilla/5.0" "$u"; file -b i; done
