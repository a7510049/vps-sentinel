name: flydebug
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s -m 20 -o 8.js https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/8.js
          curl -s -m 20 -o 7.js https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/7.js
          curl -s -m 20 -o A.js https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/A.js
          python3 - <<'PY'
          import gzip, json
          for f in ("8.js","7.js","A.js"):
              d = json.loads(gzip.decompress(open(f,"rb").read()))
              ks = list(d.keys())
              print(f, len(ks), ks[:5], d.get("children"), [(k, d[k]) for k in ks if k != "children"][:3])
              print([ (k,d[k]) for k in ks if k.upper().startswith("990")][:12])
          PY
