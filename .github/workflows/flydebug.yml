name: flydebug
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for i in 1 2 3; do for n in 1 2; do curl -s -o r$n.json -w "$n %{http_code} %{time_total}s %{size_download}\n" -m 90 -A "Mozilla/5.0 (vps-sentinel)" "https://www.tca.gov.tw/?act=fids&code=api_departure_arrival&airFlyIO=$n"; done; done
          head -c 400 r2.json; echo
          python3 -c "import json;d=json.load(open('r2.json'));print(len(d.get('data') or []));print([ (r.get('AirLineIATA'),r.get('airLineNum'),r.get('opponentPort')) for r in d['data'][:40]])"
