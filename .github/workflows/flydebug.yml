# 暫時的：用真的資料跑一次看板（查完就刪）
name: flydebug
on:
  push:
    branches: [claude/project-thread-wqdvmy]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          cat > p.py <<'P'
          import sys, time
          sys.path.insert(0, "tests")
          from test_passkey import load_sentinel
          s = load_sentinel()
          for c in ["TPE", "TSA", "RMQ", "KHH"]:
              t0 = time.time()
              try:
                  b = s.fly_board(c)
                  print(c, round(time.time() - t0, 1), "s", b["srcs"], b["fids"], {k: len(b[k]) for k in ("arr", "dep", "gnd", "over")}, flush=True)
                  for k in ("arr", "dep"):
                      for p in b[k][:8]:
                          hm = lambda t: time.strftime("%H:%M", time.gmtime(t + 8 * 3600)) if t else "-"
                          print("  ", k, hm(p.get("sch")), hm(p.get("est")), p["fn"], p["al"], p["org"] and p["org"]["code"], p["dst"] and p["dst"]["code"], p.get("gate"), p["st"], p.get("share"), "LIVE" if p.get("live") or not p.get("fids") else "", flush=True)
              except Exception as e:
                  import traceback; traceback.print_exc()
              time.sleep(1.5)
          P
          python3 p.py
