name: flydebug
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for n in 1 2; do curl -s -L -o /tmp/b -A "Mozilla/5.0 (vps-sentinel)" -w "rmq$n %{http_code} first=%{time_starttransfer} total=%{time_total} size=%{size_download}\n" --max-time 40 "https://www.tca.gov.tw/index.php?act=fids&code=api_departure_arrival&airFlyIO=$n"; done
          curl -s -o /dev/null -L -w "home %{http_code} total=%{time_total}\n" --max-time 40 "https://www.tca.gov.tw/"
          true
      - run: |
          pip install -q pillow
          mkdir -p /tmp/l && cd /tmp/l
          A="BR CI JX IT AE B7 CX NH JL 5J"
          for a in $A; do
            curl -s -L -o "1_$a.png" "https://www.gstatic.com/flights/airline_logos/70px/$a.png"
            curl -s -L -o "2_$a.png" "https://images.kiwi.com/airlines/64x64/$a.png"
            curl -s -L -o "3_$a.png" "https://content.r9cdn.net/rimg/provider-logos/airlines/v/$a.png?crop=false&width=108&height=92&fallback=default2.png"
            curl -s -L -o "4_$a.png" "https://pics.avs.io/64/64/$a.png"
          done
          curl -s -o 1_ZZ.png "https://www.gstatic.com/flights/airline_logos/70px/ZZ.png"; curl -s -L -o 2_ZZ.png "https://images.kiwi.com/airlines/64x64/ZZ.png"; curl -s -L -o 3_ZZ.png "https://content.r9cdn.net/rimg/provider-logos/airlines/v/ZZ.png?crop=false&width=108&height=92&fallback=default2.png"; curl -s -L -o 4_ZZ.png "https://pics.avs.io/64/64/ZZ.png"
          md5sum *_ZZ.png 1_BR.png
          python3 - <<'PY'
          from PIL import Image
          A="BR CI JX IT B7 CX ZZ".split(); S=36
          m=Image.new("RGB",(2*(S+4),len(A)*(S+4)),(200,200,200))
          for i,a in enumerate(A):
              for s in (0,1):
                  try:
                      im=Image.open(f"{s+1}_{a}.png").convert("RGBA"); im.thumbnail((S,S))
                      bg=Image.new("RGBA",(S,S),(255,255,255,255)); bg.alpha_composite(im,((S-im.width)//2,(S-im.height)//2)); t=bg.convert("RGB")
                  except Exception: t=Image.new("RGB",(S,S),(255,0,0))
                  m.paste(t,(s*(S+4)+2,i*(S+4)+2))
          m=m.quantize(32); m.save("m.png",optimize=True)
          PY
          ls -la m.png; echo "B64START"; base64 -w0 m.png; echo; echo "B64END"
