# 暫時的：看松山機場官網航班表的格式（查完就刪）
name: flydebug
on:
  push:
    branches: [claude/project-thread-wqdvmy]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for io in 1 2; do for line in 1 2; do echo "== line $line io $io"; curl -sS -m 60 -X POST -H "Content-Type: application/json" -d "{\"AirFlyLine\":$line,\"AirFlyIO\":$io,\"Limit\":999,\"Culture\":1,\"FlightNumber\":null,\"AirLineCode\":null,\"AirportCode\":null,\"Sort\":\"ExpectDepartureTime\",\"Order\":\"asc\"}" https://www.tsa.gov.tw/api/airFlyTab/Paging -o o.bin; python3 -c "
          import json,collections;d=json.load(open('o.bin',encoding='utf-8-sig'));print(d['total'], d.get('Floor'));r=d['rows']
          [print(json.dumps(x,ensure_ascii=False)[:1500]) for x in r[:2]+r[-1:]]
          print(collections.Counter(str(x.get('AirFlyStatus') or x.get('Status') or x.get('airFlyStatus')) for x in r))"; done; done
