name: flydebug
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s -m 15 -w "\n%{http_code}\n" -d "grant_type=client_credentials&client_id=fake&client_secret=fake" "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token"
          curl -s -m 20 -D - -o /dev/null "https://opensky-network.org/api/states/all?lamin=21.9&lomin=119.6&lamax=23.2&lomax=121.1" | grep -i "rate\|HTTP/"
