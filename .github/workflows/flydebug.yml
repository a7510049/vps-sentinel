name: flydebug
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://www.taoyuan-airport.com/uploads/flightx/a_flight_v4.txt | iconv -f big5-hkscs -t utf-8 -c > tpe.txt
          set +e
          echo "== CI706"; awk -F, '$3~/CI/ && $5+0>=700 && $5+0<=712' tpe.txt; echo == A34; grep -i 'A34\|340' tpe.txt
          echo "== type values"; awk -F, '{print $15}' tpe.txt | sort | uniq -c | sort -rn
          echo "== adsb CAL"; curl -s https://opendata.adsb.fi/api/v3/lat/25.08/lon/121.23/dist/150 | python3 -c "
          import json,sys
          for a in json.load(sys.stdin).get('ac',[]):
            f=(a.get('flight') or '').strip()
            if f.startswith('CAL'): print(f,a.get('hex'),a.get('r'),a.get('t'),a.get('desc'))"
