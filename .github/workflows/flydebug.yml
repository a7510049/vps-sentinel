name: flydebug
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for a in BR CI JX IT AE B7 CX NH JL KE TR VJ MM 5J OZ SQ GK 7C UO HX; do
            for u in "https://pics.avs.io/64/64/$a.png" "https://images.kiwi.com/airlines/64/$a.png" "https://content.airhex.com/content/logos/airlines_${a}_64_64_s.png"; do
              r=$(curl -s -o /tmp/x -w "%{http_code} %{content_type} %{size_download}" --max-time 10 "$u"); echo "$a $r $(md5sum </tmp/x | cut -c1-8) $u"
            done
          done
          curl -s -D - -o /dev/null https://pics.avs.io/64/64/BR.png | head -20
          curl -s -D - -o /dev/null https://images.kiwi.com/airlines/64/BR.png | head -20
