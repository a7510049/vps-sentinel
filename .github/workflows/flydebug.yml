name: flydebug
on: push
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/l && cd /tmp/l
          for a in BR CI JX IT AE B7 CX NH JL KE TR VJ MM 5J UA; do
            curl -s -L -o "g70_$a.png" -w "%{http_code} %{content_type} %{size_download} g70 $a\n" "https://www.gstatic.com/flights/airline_logos/70px/$a.png"
            curl -s -L -o "gd_$a.png" -w "%{http_code} %{content_type} %{size_download} gdark $a\n" "https://www.gstatic.com/flights/airline_logos/70px/dark/$a.png"
            curl -s -L -o "kw_$a.png" -w "%{http_code} %{content_type} %{size_download} kiwi $a\n" "https://images.kiwi.com/airlines/64x64/$a.png"
            curl -s -L -o "ky_$a.png" -w "%{http_code} %{content_type} %{size_download} kayak $a\n" "https://content.r9cdn.net/rimg/provider-logos/airlines/v/$a.png?crop=false&width=108&height=92&fallback=default2.png"
            curl -s -L -o "al_$a.png" -w "%{http_code} %{content_type} %{size_download} airlabs $a\n" "https://airlabs.co/img/airline/m/$a.png"
          done
          curl -s -D - -o /dev/null "https://www.gstatic.com/flights/airline_logos/70px/BR.png" | grep -i "access-control\|cache-control\|content-type"
          curl -s -D - -o /dev/null "https://www.gstatic.com/flights/airline_logos/70px/ZZ.png" | head -3
          md5sum *.png | sort | uniq -c -w8 | sort -rn | head -5
          tar czf - *.png | base64 -w0 > /tmp/b64; echo; echo "B64LEN $(wc -c < /tmp/b64)"; fold -w 4000 /tmp/b64
