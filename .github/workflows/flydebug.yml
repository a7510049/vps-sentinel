name: flydebug
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s https://www.taoyuan-airport.com/uploads/flightx/a_flight_v4.txt | iconv -f big5-hkscs -t utf-8 -c | awk -F, '{gsub(/ /,"",$3); print $3}' > c.txt
          curl -s https://www.kia.gov.tw/data/arr.json https://www.kia.gov.tw/data/dep.json | grep -o '"airLineIATA":"[^"]*"' | cut -d'"' -f4 >> c.txt
          sort -u c.txt | grep -E '^[A-Z0-9]{2}$' > codes.txt; wc -l codes.txt
          curl -s -o ph.png https://www.gstatic.com/flights/airline_logos/70px/ZZ.png; md5sum ph.png
          P=$(md5sum ph.png | cut -c1-32)
          echo "== real logos"; for c in $(cat codes.txt) 9G VU QV; do curl -s -o l.png -w '%{http_code}' https://www.gstatic.com/flights/airline_logos/70px/$c.png >/dev/null; m=$(md5sum l.png|cut -c1-32); [ "$m" != "$P" ] && printf '%s ' $c; done; echo
          echo "== no logo"; for c in $(cat codes.txt); do curl -s -o l.png https://www.gstatic.com/flights/airline_logos/70px/$c.png; m=$(md5sum l.png|cut -c1-32); [ "$m" = "$P" ] && printf '%s ' $c; done; echo
          echo "== RMQ"; for n in 1 2; do curl -s -o r$n.json -w "%{http_code} %{time_total}s %{size_download}\n" -m 90 -A "Mozilla/5.0 (vps-sentinel)" "https://www.tca.gov.tw/index.php?act=fids&code=api_departure_arrival&airFlyIO=$n"; done
          head -c 300 r2.json
