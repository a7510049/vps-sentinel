# 暫時的：看台灣機場官網航班表的格式（查完就刪）
name: flydebug
on:
  push:
    branches: [claude/project-thread-wqdvmy]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          get() { echo; echo "=== $1"; curl -sSL -m 25 -A "$UA" -o o.bin -w "code %{http_code} type %{content_type} size %{size_download}\n" "$1" || true; }
          get "https://www.kia.gov.tw/data/arr.json"; head -c 1500 o.bin; echo; python3 -c "import json;d=json.load(open('o.bin',encoding='utf-8-sig'));print(type(d), len(d), list(d)[:5] if isinstance(d,dict) else '')" || true
          get "https://www.kia.gov.tw/data/dep.json"; head -c 1200 o.bin; echo
          get "https://www.kia.gov.tw/data/airport2.json"; head -c 600 o.bin; echo
          get "https://www.tca.gov.tw/index.php?act=fids&code=departure_arrival"
          python3 - <<'P'
          import re
          s=open('o.bin',encoding='utf-8',errors='replace').read()
          for k in ['dataView','apiCode','act=refresh','placeLabelTh','抵達','出發','arrival','departure']:
              for m in list(re.finditer(re.escape(k),s))[:4]:
                  print('---',k,m.start()); print(re.sub(r'\s+',' ',s[max(0,m.start()-300):m.start()+500]))
          print('ROWS', s.count('class="itema"'))
          P
          get "https://www.tsa.gov.tw/_next/static/chunks/pages/flights/domestic/today-5ddfc89f067a5ff7.js"; grep -oE '"[^"]*(api|Api|API)[^"]*"' o.bin | sort -u | head -40; grep -oE 'https?://[^"]+' o.bin | sort -u | head
          get "https://www.tsa.gov.tw/"; grep -oE '/_next/static/chunks/[^"]+\.js' o.bin | sort -u | head -20 > chunks.txt; cat chunks.txt
          for c in $(cat chunks.txt); do curl -sSL -m 20 -A "$UA" "https://www.tsa.gov.tw$c" | grep -oE '"[^"]{0,60}(/api/|api\.|Flight|flight)[^"]{0,80}"' | sort -u | head -15; done
