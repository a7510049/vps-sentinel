# 機場跑道、滑行道地圖：從 OpenStreetMap 重抓 data/apmap.tsv 並提交回這個分支（改了 tools/apmap.py 或手動執行時）
name: apmap
on:
  workflow_dispatch:
  push:
    paths: [tools/apmap.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apmap.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apmap.tsv
          git diff --cached --quiet || { git commit -m "更新機場跑道、滑行道地圖（OpenStreetMap）"; git push; }
