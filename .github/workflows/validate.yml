name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check shell syntax
        run: >-
          bash -n install.sh setup.sh scripts/*.sh vps-monitor/install.sh
          controller/*.sh controller/vps-sentinel-enroll

      - name: Run ShellCheck
        run: >-
          shellcheck install.sh setup.sh scripts/*.sh vps-monitor/install.sh
          controller/*.sh controller/vps-sentinel-enroll

      - name: Check dashboard card syntax
        run: >-
          node --check home-assistant/www/vps-sentinel-apple-card.js &&
          node --check home-assistant/www/vps-sentinel-fleet-card.js

      - name: Run Fleet Card runtime contract
        run: node tests/fleet_card_runtime.mjs

      - name: Check Blueprint YAML syntax
        run: ruby -e "require 'yaml'; Dir['home-assistant/blueprints/*.yaml'].each { |file| YAML.parse_file(file) }"

      - name: Check dashboard YAML syntax
        run: >-
          ruby -e 'require "yaml";
          source = File.read("scripts/manage.sh");
          dashboard = source.match(/cat > "\$\{DASHBOARD_FILE\}" <<YAML\n(.*?)\nYAML/m).captures.first;
          YAML.parse(dashboard.gsub("${vps_id}", "demo"))'

      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v7.0.0
        with:
          go-version-file: go-agent/go.mod
          cache: false

      - name: Validate Go Agent prototype
        run: |
          cd go-agent
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "${unformatted}"
            exit 1
          fi
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../go-agent-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../go-agent-arm64 .
          cd ..
          VPS_ID=go-contract-01 VPS_NAME="Go Contract" ./go-agent-amd64 --once |
            python3 tests/validate_go_agent_output.py
          sha256sum go-agent-amd64 go-agent-arm64

      - name: Scan Go source and binaries for known vulnerabilities
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          cd go-agent
          govulncheck ./...
          cd ..
          govulncheck -mode binary go-agent-amd64
          govulncheck -mode binary go-agent-arm64

      - name: Generate amd64 SPDX SBOM
        uses: anchore/sbom-action@4a30bbadbe35d73a1729ee95a9196544192d905e
        with:
          file: go-agent-amd64
          format: spdx-json
          output-file: go-agent-amd64.spdx.json
          artifact-name: go-agent-amd64-sbom
          syft-version: v1.44.0
          upload-release-assets: false

      - name: Generate arm64 SPDX SBOM
        uses: anchore/sbom-action@4a30bbadbe35d73a1729ee95a9196544192d905e
        with:
          file: go-agent-arm64
          format: spdx-json
          output-file: go-agent-arm64.spdx.json
          artifact-name: go-agent-arm64-sbom
          syft-version: v1.44.0
          upload-release-assets: false

      - name: Validate Go SBOM documents
        run: |
          python3 - <<'PY'
          import json

          documents = {
              "go-agent-amd64.spdx.json": "SPDX-2.3",
              "go-agent-arm64.spdx.json": "SPDX-2.3",
          }
          for path, expected_version in documents.items():
              with open(path, encoding="utf-8") as handle:
                  document = json.load(handle)
              actual_version = document.get("spdxVersion")
              if actual_version != expected_version:
                  raise SystemExit(
                      f"{path}: expected {expected_version}, got {actual_version!r}"
                  )
          PY

      - name: Install Python dependencies
        run: >-
          python3 -m pip install
          -r vps-monitor/requirements.txt
          -r controller/requirements.txt

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Python syntax
        run: >-
          python3 -m py_compile
          controller/apply_agent_config.py
          controller/bootstrap.py
          controller/broker_policy.py
          controller/controller.py
          controller/enroll_cli.py
          controller/enrollment.py
          controller/enrollment_bundle.py
          controller/install_config.py
          controller/node_registry.py
          controller/register_frontend.py
          vps-monitor/vps_monitor.py
          vps-monitor/node_contract.py
          vps-monitor/legacy_adapter.py
          scripts/beta-evidence.py
          scripts/stability-soak.py
          scripts/v1-attestation.py
          scripts/verify-v1-evidence.py
          tests/test_agent_benchmark.py
          tests/test_apply_agent_config.py
          tests/test_beta_evidence.py
          tests/test_broker_policy.py
          tests/test_controller.py
          tests/test_controller_install.py
          tests/test_enroll_cli.py
          tests/test_enrollment.py
          tests/test_enrollment_bundle.py
          tests/test_fleet_card.py
          tests/test_frontend_registration.py
          tests/test_go_supply_chain.py
          tests/test_install_config.py
          tests/test_legacy_adapter.py
          tests/test_node_contract.py
          tests/test_node_registry.py
          tests/test_v1_publisher.py
          tests/test_unified_installer.py
          tests/test_upgrade_roles.py
          tests/test_vps_monitor.py
          tests/test_v1_attestation.py
          tests/test_v1_evidence_gate.py
          tests/test_command_interface.py
          tests/test_combined_migration.py
          tests/mqtt_integration.py
          tests/test_release_integrity.py
          tests/test_restore_roles.py
          tests/test_stability_soak.py
          tests/validate_go_agent_output.py
          benchmarks/agent_benchmark.py
          benchmarks/compare_agent_benchmarks.py

      - name: Check moved script references
        run: |
          if grep -R --line-number --exclude-dir=.git \
            -E '\$\{REPO_DIR\}/(apple-dashboard|automations|backup|doctor|manage|uninstall|update|upgrade)\.sh|\$\{source_dir\}/(apple-dashboard|automations|backup|doctor|manage|uninstall|update|upgrade)\.sh' .; then
            exit 1
          fi

      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  mqtt-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mosquitto mosquitto-clients

      - name: Install integration dependencies
        run: >-
          python3 -m pip install
          -r vps-monitor/requirements.txt
          -r controller/requirements.txt

      - name: Run three-node MQTT integration
        run: python3 tests/mqtt_integration.py
