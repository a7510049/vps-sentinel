name: alprobe
on:
  push:
    paths: [tools/al_probe.py, .github/workflows/alprobe.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p /tmp/d && printf 'PORT=1\nTOKEN=x\nNAME=x\nDATA_DIR=/tmp/d\n' > /tmp/none.conf && python3 tools/al_probe.py
