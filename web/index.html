<!doctype html>
<html lang="zh-Hant-TW" data-mode="dark" data-accent="blue">
<head>
<meta charset="utf-8">
<script>
/* 安裝時給的網址（#t=密碼）：一打開就把密碼從網址拿掉，網址列和瀏覽紀錄都不會留著 */
(function(){ try {
  var u = new URL(location.href), h = new URLSearchParams(location.hash.slice(1)), t = h.get("t") || u.searchParams.get("t");
  if (t) { window._t0 = t; u.searchParams.delete("t"); h.delete("t"); history.replaceState(null, "", u.pathname + (u.search.length > 1 ? u.search : "") + (h.toString() ? "#" + h : "")); }
} catch(e){} })();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VPS 哨兵</title>
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="icon" href="/icon.svg?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VPS 哨兵">
<meta name="theme-color" content="#121317">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* 先套用設定，避免畫面閃一下 */
document.documentElement.classList.add("booting");
(function(){ try {
  var p = JSON.parse(localStorage.getItem("vps-prefs") || "{}"), h = document.documentElement;
  var t = p.theme || "auto", dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  h.dataset.mode = dark ? "dark" : "light"; h.dataset.accent = p.accent || "blue"; h.dataset.motion = p.motion === false ? "off" : "on";
} catch(e){} })();
</script>
<style>
/*@style.css*/
</style>
</head>
<body>
<div id="splash"><div class="sp-blob"></div>
<div class="sp-title">VPS 哨兵</div><div class="sp-msg"><span>正在連線…</span></div></div>
<div id="ptr"></div>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<div class="toasts" id="toasts"></div>
<script>
/*@app.js*/
</script>
</body>
</html>
